<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentimoji</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Sentimoji</h1>
        <textarea id="text-input" rows="5" placeholder="Enter your text here..."></textarea>
        <div id="result">
            <div id="emoji"></div>
            <p id="emoji-name"></p>
        </div>
    </div>
    <script>
        const TYPING_PAUSE_MS = 300;
        const PLACEHOLDER = { emoji: "😐", name: "neutral face" };

        const input = document.getElementById("text-input");
        let pauseId;
        let analyzing = false;
        let changedWhileAnalyzing = false;

        function render({ emoji, name }) {
            document.getElementById("emoji").textContent = emoji;
            document.getElementById("emoji-name").textContent = name;
        }

        async function analyze() {
            if (analyzing) {
                changedWhileAnalyzing = true;
                return;
            }
            const text = input.value.trim();
            if (!text) return render(PLACEHOLDER);

            analyzing = true;
            try {
                const response = await fetch("/sentiment", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text }),
                });
                const result = await response.json();
                render(response.ok ? result : { emoji: "⚠️", name: result.error });
            } catch (error) {
                render({ emoji: "⚠️", name: error.message });
            } finally {
                analyzing = false;
            }
            if (changedWhileAnalyzing) {
                changedWhileAnalyzing = false;
                analyze();
            }
        }

        input.addEventListener("input", () => {
            clearTimeout(pauseId);
            pauseId = setTimeout(analyze, TYPING_PAUSE_MS);
        });

        render(PLACEHOLDER);
    </script>
</body>
</html>
