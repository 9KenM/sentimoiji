<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Sentiment Analysis</h1>
        <textarea id="text-input" rows="5" placeholder="Enter your text here..."></textarea>
        <div id="result">
            <div id="sentiment" data-sentiment="neutral"></div>
            <p id="emotion">Neutral</p>
        </div>
    </div>
    <script>
        let timeoutId;

        function handleInput() {
            getSentiment('fast');

            if(timeoutId) clearTimeout(timeoutId);

            timeoutId = setTimeout(() => {
                getSentiment('accurate');
            }, 1000);
        }

        function getSentiment(type) {
            const text = document.getElementById("text-input").value;
            const xhr = new XMLHttpRequest();
            xhr.open("POST", `/${type}-sentiment`, true);
            xhr.setRequestHeader("Content-Type", "application/json");
            xhr.send(JSON.stringify({text: text}));
            xhr.onreadystatechange = function() {
                if (xhr.readyState == 4 && xhr.status == 200) {
                    const response = JSON.parse(xhr.responseText);
                    document.getElementById("sentiment").dataset.sentiment = response.sentiment.toLowerCase();
                    document.getElementById("emotion").textContent = response.sentiment;
                }
            }
        }

        document.getElementById("text-input").addEventListener("input", handleInput);
    </script>
</body>
</html>
